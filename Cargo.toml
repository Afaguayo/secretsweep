[package]
name = "secretsweep"
version = "0.1.0"
edition = "2021"
authors = ["Emmanuel Penafiel"]
description = "Scans a directory for likely leaked secrets using regex rules plus Shannon-entropy analysis."
license = "MIT"
repository = "https://github.com/Afaguayo/secretsweep"

[[bin]]
name = "secretsweep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
once_cell = "1.19"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tempfile = "3.10"
